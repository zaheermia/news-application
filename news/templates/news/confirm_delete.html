{% extends 'news/base.html' %}

{% block content %}
    <h1>Delete "{{ item }}"?</h1>
    <p>This can't be undone.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="danger">Yes, delete it</button>
        <a href="javascript:history.back()">Cancel</a>
    </form>
{% endblock %}
