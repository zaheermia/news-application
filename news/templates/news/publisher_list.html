{% extends 'news/base.html' %}

{% block content %}
    <h1>Publishers</h1>
    {% for publisher in publishers %}
        <div class="card">
            <h3><a href="{% url 'publisher_detail' publisher.id %}">{{ publisher.name }}</a></h3>
            <p>{{ publisher.description }}</p>
        </div>
    {% empty %}
        <p>No publishers to show.</p>
    {% endfor %}
{% endblock %}
